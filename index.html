<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muhammad Azan | Portfolio</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f4f7fb, #e8f1ff);
        color: #0f172a;
      }

      .card {
        background: white;
        padding: 2.5rem 2rem;
        border-radius: 16px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
        text-align: center;
        max-width: 560px;
        width: min(90vw, 560px);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.8rem, 3vw, 2.4rem);
      }

      .role {
        margin: 0 0 0.65rem;
        font-size: 1.08rem;
        color: #334155;
      }

      .details {
        margin: 0;
        color: #475569;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Muhammad Azan</h1>
      <p class="role">Computer Science Undergraduate</p>
      <p class="details">Sukkur IBA University<br />Sukkur, Sindh, Pakistan</p>
    </main>
  </body>
</html>
